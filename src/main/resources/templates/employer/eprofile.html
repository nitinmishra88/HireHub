<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Company Profile - HireHub</title>

    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">

    <style>
        .profile-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .logo-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0d6efd;
        }

        .profile-header {
            background: linear-gradient(120deg,#0d6efd,#0b5ed7);
            color: white;
            padding: 40px;
            border-radius: 15px 15px 0 0;
        }
    </style>
</head>

<body>

<div th:replace="/fragments/eheader :: eheader"></div>

<div class="container mt-5">

    <div class="card profile-card">

        <div class="profile-header text-center">
            <h2>Company Profile</h2>
            <p>Manage your company details</p>
        </div>

        <div class="card-body p-4">

            <form
                th:action="@{/employer/uploadlogo}"
                method="post"
                enctype="multipart/form-data">

                <div class="text-center mb-4">

                    <!-- Existing Logo -->
                    <img
                        th:if="${employer.companyLogo != null}"
                        th:src="@{'/uploads/' + ${employer.companyLogo}}"
                        class="logo-preview">

                    <!-- Default Logo -->
                    <img
                        th:if="${employer.companyLogo == null}"
                        src="https://via.placeholder.com/150"
                        class="logo-preview">

                    <div class="mt-3">
                        <input
                            type="file"
                            name="logo"
                            class="form-control"
                            accept="image/*"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary mt-3">
                        Upload Logo
                    </button>

                </div>

            </form>

            <hr>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Company Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:value="${employer.companyName}"
                        readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Employer Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:value="${employer.employerName}"
                        readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:value="${employer.email}"
                        readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:value="${employer.phone}"
                        readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Website
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:value="${employer.website}"
                        readonly>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Industry
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:value="${employer.industry}"
                        readonly>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        th:value="${employer.location}"
                        readonly>
                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="/fragments/efooter :: efooter"></div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
