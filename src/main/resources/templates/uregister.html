<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Job Seeker Registration - HireHub</title>
	<link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>

<body>

	<!-- HEADER -->
	<div th:replace="fragments/header :: header"></div>

	<div class="container mt-5 mb-5">
		<div class="row justify-content-center">
			<div class="col-lg-7 col-md-9 col-sm-12">
				<div class="card shadow-sm">
					<div class="card-body">
						<h3 class="card-title text-center mb-4">Job Seeker Registration</h3>

						<!-- Success/Error Messages -->
						<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
						<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

						<form th:action="@{/register/user}" th:object="${user}" method="post">
							<!-- Name field -->
							<div class="mb-3">
								<label for="name" class="form-label">Full Name: <span
										class="text-danger">*</span></label>
								<input type="text" id="name" th:field="*{name}" class="form-control"
									placeholder="Enter your name" required>
								<!-- Error display -->
								<div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
							</div>

							<!-- Email field -->
							<div class="mb-3">
								<label for="email" class="form-label">Email: <span class="text-danger">*</span></label>
								<input type="email" id="email" th:field="*{email}" class="form-control"
									placeholder="Enter your email" required>
								<div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}">
								</div>
							</div>

							<div class="mb-3">
								<label for="phone" class="form-label">Phone: <span class="text-danger">*</span></label>
								<input type="text" id="phone" th:field="*{phone}" class="form-control"
									placeholder="Enter phone number" required>
								<div th:if="${#fields.hasErrors('phone')}" class="text-danger" th:errors="*{phone}">
								</div>
							</div>
							<!-- Password -->
							<div class="mb-3">
								<label for="password" class="form-label">Password: <span
										class="text-danger">*</span></label>
								<input type="password" id="password" th:field="*{password}" class="form-control"
									placeholder="Enter password" required>
								<div th:if="${#fields.hasErrors('password')}" class="text-danger"
									th:errors="*{password}"></div>
							</div>

							<!-- Confirm Password -->
							<div class="mb-3">
								<label for="confirmPassword" class="form-label">Confirm Password: <span
										class="text-danger">*</span></label>
								<input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
									placeholder="Confirm password" required>
								<div th:if="${#fields.hasErrors('password')}" class="text-danger"
									th:errors="*{password}"></div>
							</div>



							<!-- Submit -->
							<button type="submit" class="btn btn-primary w-100">Register</button>

							<!-- Success message -->
							<div th:if="${successMessage}" class="alert alert-success mt-3" th:text="${successMessage}">
							</div>
						</form>

						<p class="mt-3 text-center">
							Already registered? <a th:href="@{/user/login}" class="text-decoration-none">Login here</a>
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- FOOTER -->
	<div th:replace="fragments/footer :: footer"></div>

	<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
