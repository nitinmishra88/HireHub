<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Employer Login - HireHub</title>
	<link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
	<style>
	       body{
	           background: linear-gradient(to right, #e3f2fd, #ffffff);
	       }
	       .login-card{
	           border-radius: 12px;
			margin-bottom: 5%;
	       }
	     
	   </style>
</head>

<body>

	<!-- HEADER -->
	<div th:replace="fragments/header :: header"></div>

	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card login-card shadow-sm">
					<div class="card-body">
						<h3 class="card-title mb-4 text-center">Employer Login</h3>

						<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"
							id="errorMessage"></div>
						<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"
							id="errorMessage"></div>

						<form th:action="@{/login/employer}" method="post">
							<div class="mb-3">
								<label for="email" class="form-label">Email:</label>
								<input type="email" id="email" name="email" class="form-control"
									placeholder="Enter your email" required>
							</div>
							<div class="mb-3">
								<label for="password" class="form-label">Password:</label>
								<input type="password" id="password" name="password" class="form-control"
									placeholder="Enter your password" required>
							</div>
							<button type="submit" class="btn btn-primary w-100">Login</button>
						</form>
						<p class="mt-3 text-center">
							Don't have an account? <a th:href="@{/employer/register}">Register here</a>
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- FOOTER -->
	<div th:replace="fragments/footer :: footer "></div>

	<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
	<script>
		const msg = document.getElementById('errorMessage');
		if (msg) {
			setTimeout(() => {
				msg.style.display = 'none';
			}, 3000);
		}
	</script>
</body>

</html>
