<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Complete Profile</title>

<link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>

<body>

<div th:replace="/fragments/uheader :: uheader"></div>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4 text-center">
            Complete Your Profile
        </h2>

        <form th:action="@{/user/save-profile}"
              method="post"
              enctype="multipart/form-data"
              th:object="${user}">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Qualification</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{qualification}">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Experience</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{experience}">
                </div>

            </div>

            <div class="mb-3">
                <label>Skills</label>
                <textarea class="form-control"
                          rows="3"
                          th:field="*{skills}"></textarea>
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea class="form-control"
                          rows="3"
                          th:field="*{address}"></textarea>
            </div>

            <div class="mb-3">
                <label>LinkedIn Profile</label>
                <input type="text"
                       class="form-control"
                       th:field="*{linkedin}">
            </div>

            <div class="mb-3">
                <label>Profile Photo</label>
                <input type="file"
                       class="form-control"
                       name="photoFile"
                       accept="image/*">
            </div>

            <div class="mb-3">
                <label>Resume</label>
                <input type="file"
                       class="form-control"
                       name="resumeFile"
                       accept=".pdf,.doc,.docx">
            </div>

            <button type="submit"
                    class="btn btn-success">
                Save Profile
            </button>

            <a href="/user/dashboard"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

<div th:replace="/fragments/ufooter :: ufooter"></div>

</body>
</html>
