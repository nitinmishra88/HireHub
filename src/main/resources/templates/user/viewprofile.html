<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Profile - HireHub</title>

<link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">

<style>

.profile-card{
    border:none;
    border-radius:20px;
}

.profile-img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #0d6efd;
}

</style>

</head>

<body>

<div th:replace="/fragments/uheader :: uheader"></div>

<div class="container mt-5">

    <div class="card shadow profile-card">

        <div class="card-body p-5">

            <div class="text-center">

                <!-- Profile Photo -->

                <img th:if="${user.profilePhoto != null}"
                     th:src="@{'/uploads/' + ${user.profilePhoto}}"
                     class="profile-img">

                <img th:if="${user.profilePhoto == null}"
                     src="https://via.placeholder.com/150"
                     class="profile-img">

                <h3 class="mt-3" th:text="${user.name}">
                    User Name
                </h3>

                <p class="text-muted" th:text="${user.email}">
                    Email
                </p>

            </div>

            <hr>

            <div class="row">

                <div class="col-md-6">

                    <h5>Basic Information</h5>

                    <p>
                        <strong>Phone:</strong>
                        <span th:text="${user.phone}"></span>
                    </p>

                    <p>
                        <strong>Qualification:</strong>
                        <span th:text="${user.qualification}"></span>
                    </p>

                    <p>
                        <strong>Experience:</strong>
                        <span th:text="${user.experience}"></span>
                    </p>

                </div>

                <div class="col-md-6">

                    <h5>Professional Details</h5>

                    <p>
                        <strong>Skills:</strong>
                        <span th:text="${user.skills}"></span>
                    </p>

                    <p>
                        <strong>Address:</strong>
                        <span th:text="${user.address}"></span>
                    </p>

                    <p>
                        <strong>LinkedIn:</strong>
                        <a th:href="${user.linkedin}"
                           target="_blank"
                           th:text="${user.linkedin}">
                        </a>
                    </p>

                </div>

            </div>

            <hr>

            <div class="text-center">

                <a th:if="${user.resume != null}"
                   th:href="@{'/uploads/' + ${user.resume}}"
                   target="_blank"
                   class="btn btn-success">
                    View Resume
                </a>

                <a href="/user/complete-profile"
                   class="btn btn-primary">
                    Edit Profile
                </a>

                <a href="/user/dashboard"
                   class="btn btn-secondary">
                    Back
                </a>

            </div>

        </div>

    </div>

</div>

<div th:replace="/fragments/ufooter :: ufooter"></div>

<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
